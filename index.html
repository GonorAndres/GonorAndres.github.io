<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gonor.me</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://gonor.me/">
<meta http-equiv="refresh" content="0; url=https://gonor.me/">
<script>
  // Preserve path, query and hash so old deep links land on the same page.
  // /GonorPage/* was the portfolio's project-site path before it had a custom
  // domain; drop that prefix so those links land on the same page too.
  var path = location.pathname.replace(/^\/GonorPage(?=\/|$)/, '') || '/';
  location.replace('https://gonor.me' + path + location.search + location.hash);
</script>
</head>
<body>
<p>Este sitio se movió a <a href="https://gonor.me/">gonor.me</a>.</p>
</body>
</html>
